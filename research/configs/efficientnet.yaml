# E01 EfficientNet-B0 only, baseline
model: efficientnet_b0
arch: efficientnet_b0
pretrained: true
pretrained_source: timm
num_classes: 3
input_size: 224
train:
  optimizer: AdamW
  learning_rate: 0.0001
  learning_rates_to_compare: [0.0001, 0.0003]
  weight_decay: 0.0001
  batch_size: 16
  max_epochs: 50
  early_stopping_patience: 8
  early_stopping_monitor: val_macro_f1
  loss: weighted_cross_entropy
  seeds: [42, 123, 2026]
data:
  config: configs/data.yaml
