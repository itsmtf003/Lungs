# Shared training config. Same for all 3 models.
# Do not change one model only. Fair comparison needs the same rules.
optimizer: AdamW
learning_rates_to_compare:
  - 0.0001
  - 0.0003
learning_rate: 0.0001
weight_decay: 0.0001
batch_size: 16
max_epochs: 50
early_stopping:
  patience: 8
  monitor: val_macro_f1
  mode: max
loss: weighted_cross_entropy
loss_weights_from: train_labels_only
checkpoint:
  select_by: val_macro_f1
  tie_break: val_loss
  save_best: true
  save_latest: true
seeds:
  - 42
  - 123
  - 2026
mixed_precision: true
mixed_precision_note: "Allowed only after a finite-gradient check on the chosen GPU."
num_workers: 2
